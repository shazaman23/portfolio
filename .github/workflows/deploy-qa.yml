# Deploys any branch to qa.jakekillpack.com. Run it from the Actions tab
# (Deploy QA > Run workflow) and pick the branch.
name: Deploy QA

on:
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: qa
    permissions:
      contents: read
      id-token: write
